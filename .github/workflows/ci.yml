name: CI
on:
  push:
    branches: [main, master, research-lab]
  pull_request:

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt
      - name: Run isolated research tests
        run: PYTHONPATH=. pytest -q tests/research
      - name: Lint research code
        run: python -m compileall -q backtests tests/research

  application-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run application tests
        run: make test
