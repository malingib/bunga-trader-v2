name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          # Install runtime + test deps. requirements.txt is the source of truth.
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run test suite
        # The Makefile strips the leaked Hermes-agent PYTHONPATH that otherwise
        # makes the 3.12 venv import the wrong (3.11) pydantic and crash.
        run: make test

      - name: Lint (best-effort)
        run: make lint
